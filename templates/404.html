<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>404 - MiraNex</title>
        <link rel="icon" href="{{ url_for('static', filename='images/miranex.png') }}">

        <style>
            * {
                padding: 0;
                margin: 0;
            }

            body {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    "Open Sans",
                    "Helvetica Neue",
                    sans-serif;
                background-color: #101822;
                color: whitesmoke;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            a {
                color: whitesmoke;
                text-decoration: none;
                background-color: rgb(26, 106, 255);
                border-radius: 8px;
                padding: 9px 14px;
                font-weight: bold;
                white-space: nowrap;
                font-size: 15px;
            }

            .container {
                display: flex;
                gap: 110px;
                align-items: center;
                justify-content: center;
                border-radius: 20px;
                padding: 70px;
                background: radial-gradient(#1a293a, #121a25);
            }

            .left-side img {
                user-select: none;
                width: 400px;
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7))
                    drop-shadow(4px 4px 15px rgba(115, 10, 201, 0.5));
            }

            .right-side {
                display: flex;
                flex-direction: column;
                gap: 60px;
            }

            .head {
                display: flex;
                flex-direction: column;
            }

            .head h1 {
                font-size: 130px;
                transform: scaleY(1.1);
            }

            .text p {
                font-size: 17px;
                margin-bottom: 10px;
            }

            .text label {
                font-size: 15px;
            }

            .back-btn {
                margin-top: 10px;
            }

            @media (max-width: 1080px) {
                .container {
                    flex-direction: column;
                    gap: 30px;
                    padding: 80px 130px;
                }

                .left-side img {
                    width: 250px;
                }

                .text {
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                }

                .right-side {
                    justify-content: center;
                    align-items: center;
                }

                .right-side h1 {
                    font-size: 100px;
                }
            }

            @media (max-width: 768px) {
                body {
                    background-color: #101822;
                }

                .container {
                    background: none;
                    filter: none;
                    padding: 20px;
                }

                .left-side img {
                    width: 240px;
                }

                .head{
                    justify-content: center;
                    align-items: center;
                }

                .right-side {
                    justify-content: center;
                    align-items: center;
                    gap: 35px;
                }

                .right-side h1 {
                    font-size: 80px;
                }

                .text p,
                label {
                    white-space: nowrap;
                }

                .text p{
                    font-size: 13px;
                }

                .text label{
                    font-size: 12px;
                }

                a{
                    font-size: 12px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="left-side">
                <img src="{{ url_for('static', filename = 'images/aizen.png') }}" alt="Image">
            </div>

            <div class="right-side">

                <div class="head">
                <h1>404</h1>
                <h2>Page Not Found</h2>
                </div>

                <div class="text">
                    <p>You coming here was all part of my plan.</p>
                    
                </div>

                <div class="back-btn">
                    <a href="{{ url_for('home') }}">Back to home</a>
                </div>

            </div>
        </div>
    </body>
</html>
